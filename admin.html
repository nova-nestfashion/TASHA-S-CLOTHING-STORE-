<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>TASHA'S CLOTHING STORE ADMIN</h1>
</header>


<section class="dashboard">

<h2>Dashboard</h2>

<p>Total Products: <span id="totalProducts">0</span></p>

<p>Total Orders: <span id="totalOrders">0</span></p>

<p>Pending Orders: <span id="pendingOrders">0</span></p>

<p>Total Sales: <span id="totalSales">K0</span></p>

<p>Low Stock Products: <span id="lowStockProducts">0</span></p>

</section>



<section>

<h2>Add Product</h2>

<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<input id="category" placeholder="Category">

<input id="stock" placeholder="Stock">

<input id="image" placeholder="Image link">


<button id="addBtn">
Add Product
</button>

</section>



<section>

<h2>Products</h2>

<div id="adminProducts"></div>

</section>



<section>

<h2>Orders</h2>

<div id="orders"></div>

</section>



<button onclick="logout()">
Logout
</button>



<script type="module" src="admin.js"></script>


</body>
</html>
